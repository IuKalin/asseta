version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: asseta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: asseta_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: asseta-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: asseta-backend-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=asseta_db;Username=postgres;Password=postgrespassword
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend-web:
    build:
      context: ../frontend-web
      dockerfile: Dockerfile
    container_name: asseta-frontend-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend-api

volumes:
  postgres_data:
  redis_data:
